<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protección · Lab 3 · UMBRAL</title>
<meta name="description" content="Cuánto aguanta tu hogar si te enfermás o te quedás sin trabajo, y qué te cubre el IGSS.">
<meta property="og:title" content="Protección · UMBRAL Lab 3">
<meta property="og:description" content="Cuánto aguanta tu hogar si te enfermás o te quedás sin trabajo, y qué te cubre el IGSS.">
<meta property="og:type" content="website"><meta property="og:url" content="https://lab3.umbralgt.com/proteccion/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sistema visual UMBRAL (Lab 1 y Lab 2). Color: blanco y negro de base; azul #2f5bd3 como único acento;
   verde, ámbar y rojo solo para el semáforo y los errores, siempre en tinte suave (igual que .traffic-* de Lab 1);
   otros colores (morado, naranja, verde de mapa) solo para distinguir categorías de datos, como las capas de Lab 1. */
:root{
  --negro:#0a0a0a; --blanco:#ffffff; --suelo:#f4f4f2; --g200:#efefef; --g300:#e3e3e3; --g400:#cfcfcf; --g600:#6b6b6b;
  --azul:#2f5bd3; --azul-claro:#eef2fc;
  --verde:#1f7a3b; --verde-claro:#e7f6ec; --ambar:#c79200; --ambar-claro:#fff7da; --rojo:#c0392b; --rojo-claro:#ffe3e3;
  --linea:1.5px solid var(--negro); --suave:1px solid var(--g300);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(54px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--blanco);color:var(--negro);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--negro)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* Barra de navegación, igual a Lab 1 y Lab 2 */
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--blanco);border-bottom:var(--linea)}
#nav .logo{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--negro);text-decoration:none;white-space:nowrap}
#nav .mods{display:flex;gap:4px;flex:1;justify-content:center}
#nav .mod{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g600);border-radius:6px;text-decoration:none}
#nav .mod.activo{color:var(--negro);background:var(--g200)}
#nav .volver{margin-left:auto;display:inline-flex;gap:8px;padding:8px 14px;background:var(--negro);color:var(--blanco);font-size:12px;font-weight:500;border-radius:8px;text-decoration:none;white-space:nowrap}
#nav .logo{min-width:0;overflow:hidden;text-overflow:ellipsis}
#nav .volver{flex:none}
@media (max-width:560px){#nav .mods{display:none}#nav{padding:0 14px;gap:8px}#nav .volver{padding:8px 12px}}

main{max-width:680px;margin:0 auto;padding:28px 20px 48px}
.ceja{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin:0 0 10px}
h1{font-size:2.1rem;line-height:1.1;letter-spacing:-.03em;font-weight:700;margin:0 0 14px}
h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--g300)}
h3{font-size:1rem;font-weight:700;margin:0 0 6px}
p{margin:0 0 14px}
.suave{color:var(--g600)}
.chico{font-size:.88rem;line-height:1.5}
.nota-lab{border:var(--linea);border-radius:8px;padding:14px 16px;margin:20px 0}
.nota-lab b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.aviso{background:var(--ambar-claro);border:1.5px solid var(--ambar);border-radius:8px;padding:10px 14px;font-size:.85rem;color:var(--ambar);margin:0 0 20px}
.aviso strong{font-weight:700}
.btn{display:block;width:100%;padding:13px;border:var(--linea);border-radius:8px;background:var(--negro);color:var(--blanco);font-size:15px;font-weight:700;text-align:center}
.btn:hover{opacity:.88}
.btn.sec{background:var(--blanco);color:var(--negro)}
.btn.sec:hover{background:var(--g200);opacity:1}
.enlace{background:none;border:0;padding:4px 0;color:var(--negro);text-decoration:underline;text-underline-offset:3px;font-size:.95rem}
.fila{display:flex;gap:10px;margin-top:20px}
.fila .btn{flex:1}

/* Pregunta */
.avance{height:4px;background:var(--g300);border-radius:2px;overflow:hidden;margin-bottom:10px}
.avance i{display:block;height:100%;background:var(--negro);transition:width .3s}
.bloque{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin-bottom:24px}
.pregunta{font-size:1.55rem;line-height:1.25;letter-spacing:-.02em;font-weight:700;margin:0 0 8px}
.opciones{display:grid;gap:8px;margin-top:20px}
.op{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:8px;border:1.5px solid var(--g400);background:var(--blanco);font-size:1rem;font-weight:500}
.op:hover{border-color:var(--negro)}
.op[aria-pressed="true"]{border-color:var(--negro);background:var(--negro);color:var(--blanco)}
.op .caja{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor}
.op.multi .caja{border-radius:4px}
.op[aria-pressed="true"] .caja{background:var(--blanco);box-shadow:inset 0 0 0 3px var(--negro)}
.monto{display:flex;align-items:center;border:1px solid var(--g400);border-radius:8px;background:var(--suelo);margin-top:20px}
.monto:focus-within{border-color:var(--negro);background:var(--blanco);box-shadow:0 0 0 1px var(--negro)}
.monto span{padding:0 2px 0 16px;font-size:1.5rem;font-weight:700;color:var(--g600)}
.monto input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.5rem;font-weight:700;padding:12px 16px 12px 4px;color:var(--negro)}
.monto input:focus{outline:none}
.unidad{display:flex;gap:8px;margin-top:10px}
.unidad .op{flex:1;justify-content:center;padding:10px}
.nose{margin-top:10px}
.ayuda{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.help-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--negro);background:var(--blanco);font-size:12px;font-weight:700;color:var(--negro);padding:0;line-height:1}
.help-icon:hover,.help-icon[aria-expanded="true"]{background:var(--negro);color:var(--blanco)}
.help-lbl{font-size:.9rem;color:var(--g600)}
.help-bubble{flex-basis:100%;background:var(--blanco);border:1.5px solid var(--negro);border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.65;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.error{color:var(--rojo);font-size:.95rem;margin-top:8px;min-height:1.4rem}

/* Escalera */
.lugar{font-size:2rem;line-height:1.1;letter-spacing:-.03em;font-weight:700;margin:4px 0 8px}
.escalera{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column-reverse}
.peldano{display:flex;align-items:center;gap:14px;padding:7px 0}
.peldano .travesano{flex:none;width:72px;height:12px;border:1.5px solid var(--g400);border-radius:2px;position:relative}
.peldano .travesano::before,.peldano .travesano::after{content:"";position:absolute;top:-10px;bottom:-10px;width:1.5px;background:var(--g400)}
.peldano .travesano::before{left:-1.5px}.peldano .travesano::after{right:-1.5px}
.peldano.hecho .travesano{background:var(--negro);border-color:var(--negro)}
.peldano.aqui .travesano{background:var(--azul);border-color:var(--azul);height:16px}
.peldano .nombre{font-size:.95rem;color:var(--g600)}
.peldano.hecho .nombre{color:var(--negro)}
.peldano.aqui .nombre{color:var(--azul);font-weight:700}
.peldano.lejos{opacity:.55}

/* Tropiezo */
.tropiezo{border:var(--linea);border-radius:10px;padding:16px;margin-top:12px}
/* Semáforo como el traffic-box de Lab 1: tinte suave, borde del mismo tono, sin mayúsculas */
.semaforo{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;border:1.5px solid}
.semaforo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.semaforo.verde{color:var(--verde);background:var(--verde-claro)}
.semaforo.amarillo{color:var(--ambar);background:var(--ambar-claro)}
.semaforo.rojo{color:var(--rojo);background:var(--rojo-claro)}
.cifra{font-size:1.8rem;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:10px 0 6px}
.pestanas{display:flex;gap:0;border:var(--linea);border-radius:8px;overflow:hidden;width:fit-content;margin:4px 0 14px}
.pestanas .op{border:0;border-radius:0;padding:8px 14px;font-size:12px;font-weight:700}
.pestanas .op .caja{display:none}
.compara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.compara div{background:var(--suelo);border:var(--suave);border-radius:8px;padding:10px 12px;font-size:.9rem}
.compara b{display:block;font-size:1.2rem;letter-spacing:-.02em}
.calma{background:var(--suelo);border:var(--linea);border-radius:10px;padding:16px;margin-top:20px}

/* Hallazgos */
.hallazgo{border:var(--suave);border-radius:10px;padding:16px;margin-top:10px}
.familia{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin-bottom:6px}
.hallazgo .vimos{font-weight:700;font-size:1.08rem;letter-spacing:-.01em;margin-bottom:8px}
.de100{border-left:3px solid var(--azul);background:var(--azul-claro);padding:8px 12px;border-radius:0 8px 8px 0;margin:12px 0}
.paso{margin-top:10px}
.nota{font-size:.85rem;color:var(--g600);margin-top:8px}
.pie{font-size:.8rem;color:var(--g600);border-top:var(--suave);margin-top:12px;padding-top:8px}
.marca-verif{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--ambar);color:var(--ambar);background:var(--ambar-claro);padding:2px 8px;border-radius:6px;margin-top:8px}

/* Cómo funciona */
.tabla{overflow-x:auto;margin:12px 0;border:var(--suave);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:30rem}
th,td{text-align:left;padding:7px 9px;border-bottom:var(--suave);vertical-align:top}
th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g600)}

footer{background:#0a0a0a;padding:28px 20px;margin-top:48px}
.pie-in{max-width:680px;margin:0 auto}
footer .lema{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:0 0 6px}
footer .per{font-size:12px;color:#777;font-style:italic;margin:0 0 20px}
.pie-fila{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:16px;border-top:1px solid #1e1e1e}
.pie-fila span{font-size:11px;color:#777;font-weight:500}
.pie-fila a{display:inline-flex;gap:8px;padding:7px 14px;background:#fff;color:#0a0a0a;font-size:11px;font-weight:500;border-radius:8px;text-decoration:none}

/* v1.1: ajustes de la primera prueba con usuario */
.porque{background:var(--suelo);border-left:3px solid var(--azul);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin:10px 0 0}
.term{display:inline;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.def{display:block;background:var(--blanco);color:var(--negro);border:1.5px solid var(--negro);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem;font-weight:400;line-height:1.55;letter-spacing:0;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.def b{font-weight:700}
.term[aria-expanded="true"]{background:var(--azul-claro)}
.explica{border:1.5px solid var(--negro);border-radius:10px;padding:12px 14px;margin-top:12px}
.explica b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.explica p{margin:0}
.desglose{display:grid;gap:8px;margin-top:20px}
.fila-gasto{display:flex;align-items:center;gap:12px;justify-content:space-between}
.fila-gasto .lbl{flex:1;font-weight:600;font-size:.98rem;line-height:1.3}
.fila-gasto small{display:block;font-weight:400;color:var(--g600);font-size:.8rem}
.chico-monto{margin-top:0;width:9rem;flex:none}
.chico-monto span{font-size:1rem;padding-left:12px}
.chico-monto input{font-size:1.05rem;padding:9px 10px 9px 2px}
.total-gasto{display:flex;justify-content:space-between;border-top:var(--linea);padding-top:10px;margin-top:4px;font-weight:700}
.resumen{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dato{border:var(--suave);border-radius:10px;padding:12px}
.dato span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g600)}
.dato b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.dato small{display:block;font-size:.78rem;color:var(--g600);line-height:1.35}
.pasos-esc{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.paso-esc{display:flex;gap:12px;padding:12px;border:var(--suave);border-radius:10px}
.paso-esc .marca{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid var(--g400);color:var(--g600)}
.paso-esc.cumple .marca{background:var(--negro);color:var(--blanco);border-color:var(--negro)}
.paso-esc.aqui{border:1.5px solid var(--azul);background:var(--azul-claro)}
.paso-esc.aqui .marca{border-color:var(--azul);color:var(--azul)}
.paso-esc.despues{opacity:.7}
.paso-esc p{margin:4px 0 0;font-size:.93rem}
.etq{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin:12px 0 2px}
.hallazgo .vimos{margin-bottom:4px}
.siguiente{border:var(--linea);border-radius:10px;padding:16px}
.siguiente .etq{margin-top:0}
.sig-texto{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.mini-esc{margin:0 0 14px;padding:0;list-style:none;counter-reset:p;display:grid;gap:6px}
.mini-esc li{counter-increment:p;display:flex;gap:10px;align-items:baseline;font-size:.95rem;color:var(--g600)}
.mini-esc li::before{content:counter(p);flex:none;width:22px;height:22px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(4px)}
.mini-esc b{color:var(--negro)}

/* v1.2: segunda prueba con usuario */
.breve{border:var(--linea);border-radius:10px;padding:16px;margin-top:4px}
.breve:focus{outline:none}
.breve .lugar{font-size:1.6rem}
.breve .siguiente{margin-top:14px;background:var(--azul-claro);border:1.5px solid var(--azul)}
.bloque-r{border:var(--linea);border-radius:10px;margin-top:10px}
.bloque-r summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.bloque-r summary::-webkit-details-marker{display:none}
.bloque-r .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.bloque-r .tit{flex:1}
.bloque-r .tit b{display:block;font-size:1.02rem;letter-spacing:-.01em}
.bloque-r .tit small{display:block;color:var(--g600);font-size:.85rem;line-height:1.4}
.bloque-r .flecha{font-size:1.4rem;transition:transform .2s}
.bloque-r[open] .flecha{transform:rotate(90deg)}
.bloque-c{padding:0 16px 16px}
.nivel{border:var(--suave);border-radius:10px;padding:12px;margin-top:8px}
.nivel-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nv{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1.5px solid}
.nv-riesgo{color:var(--rojo);background:var(--rojo-claro)}
.nv-minimo{color:var(--ambar);background:var(--ambar-claro)}
.nv-bien,.nv-ideal{color:var(--verde);background:var(--verde-claro)}
.nivel-dato{margin:6px 0 8px;font-size:.95rem}
.barra{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seg{height:8px;border-radius:2px;background:var(--g300)}
.seg.lleno{border:0}
.seg.lleno.nv-riesgo{background:var(--rojo)}.seg.lleno.nv-minimo{background:var(--ambar)}.seg.lleno.nv-bien,.seg.lleno.nv-ideal{background:var(--verde)}
.barra-et{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px}
.barra-et span{font-size:10px;color:var(--g600);line-height:1.2}
.nivel-sig{font-size:.88rem;margin:8px 0 0}
.grupo{margin-top:14px}
.grupo>h3{margin-bottom:2px}

/* v1.3 */
.compara.tres{grid-template-columns:1fr}
@media (min-width:520px){.compara.tres{grid-template-columns:repeat(3,1fr)}}
.compara span{display:block;font-size:.85rem;color:var(--g600)}
.nivel-sig{font-size:.9rem;margin:10px 0 0;background:var(--suelo);border-radius:8px;padding:8px 10px}
.alerta{border:var(--suave);border-radius:10px;padding:14px;margin-top:10px}
.alerta.marcada{border:1.5px solid var(--ambar)}
.alerta h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alerta .etq{margin-top:8px}
.alerta p{margin-bottom:4px}

/* Mi fondo de emergencia */
.probar{border:var(--linea);border-radius:10px;padding:14px 16px;margin-top:12px}
.probar label{display:block;font-size:.95rem}
.probar input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--azul)}
.probar .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.92rem}
.probar .chk input{width:18px;height:18px;accent-color:var(--azul)}
.grafica{margin:4px 0 12px;position:relative}
.grafica svg{width:100%;height:auto;display:block;touch-action:pan-y}
.g-base{stroke:var(--g400);stroke-width:1}
.g-meta{stroke:var(--g400);stroke-width:1;stroke-dasharray:4 4}
.g-et{font-size:10px;fill:var(--g600);font-family:inherit}
.g-ax{font-size:9.5px;fill:var(--g600);font-family:inherit}
.g-linea{fill:none;stroke:var(--azul);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-hito{fill:var(--azul);stroke:var(--blanco);stroke-width:2}
.g-cruz{stroke:var(--negro);stroke-width:1}
.g-tip{position:absolute;top:0;left:0;background:var(--blanco);border:1.5px solid var(--negro);border-radius:8px;padding:4px 8px;font-size:.82rem;pointer-events:none}
.hitos{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hitos li{border:var(--suave);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.hitos li.hecho{border-color:var(--verde);background:var(--verde-claro)}
.hitos span{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.hitos small{color:var(--g600);font-size:.82rem}
.lugar-g{border:var(--suave);border-radius:10px;padding:12px 14px;margin-top:10px}
.lugar-g.actual{border:1.5px solid var(--ambar)}
.lugar-g h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lugar-g dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:.9rem}
.lugar-g dt{color:var(--g600)}
.lugar-g dd{margin:0}
.progreso{background:var(--verde-claro);border:1.5px solid var(--verde);border-radius:10px;padding:12px;margin-bottom:12px}
.breve .lugar .nv{font-size:14px}

/* v0.2: calculadora en una sola pantalla */
.origen{border-left:3px solid var(--azul);background:var(--azul-claro);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin:12px 0}
.origen.ejemplo{border-left-color:var(--ambar);background:var(--ambar-claro)}
.calc{border:var(--linea);border-radius:10px;padding:14px 16px;display:grid;gap:10px;margin-top:12px}
.campo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.campo>span:first-child{font-weight:600;font-size:.97rem;line-height:1.3}
.campo small{display:block;font-weight:400;color:var(--g600);font-size:.8rem}
.calc input[type=range]{width:100%;accent-color:var(--azul);margin:0}
.extras{border-top:var(--suave);padding-top:10px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-b{border:1.5px solid var(--g400);background:var(--blanco);border-radius:8px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip-b[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:var(--blanco)}
#c-extra-det{display:grid;gap:8px}
.breve .lugar{font-size:1.2rem;line-height:1.35;letter-spacing:-.01em;font-weight:500}
.breve .lugar b{font-weight:700}

.cumplir{border:var(--linea);border-radius:10px;padding:16px;margin-top:16px}
.accion{border-top:var(--suave);padding-top:12px;margin-top:12px}
.accion h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.accion .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--azul);color:var(--blanco);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.accion p{margin-bottom:6px}
.oculto{display:none!important}

/* ===== Lab 3 · base común de herramientas (v1.0) ===== */
/* Barrita de la escalera: los 6 peldaños, el actual en negro, el tuyo marcado en azul */
#barrita{border-bottom:var(--suave);background:var(--blanco)}
.barrita{max-width:680px;margin:0 auto;padding:10px 20px 8px}
.barrita-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g600);margin-bottom:6px}
.barrita-cab a{color:var(--g600);text-decoration:underline;text-underline-offset:2px;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px}
.barrita ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.barrita li a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0 2px;border-radius:8px}
.barrita li a:hover{background:var(--g200)}
.barrita .bn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g400);color:var(--g600);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--blanco)}
.barrita .bl{font-size:10.5px;line-height:1.15;color:var(--g600);text-align:center}
.barrita li.actual .bn{background:var(--negro);border-color:var(--negro);color:var(--blanco)}
.barrita li.actual .bl{color:var(--negro);font-weight:700}
.barrita li.tuyo .bn{box-shadow:0 0 0 2px var(--blanco),0 0 0 4px var(--azul)}
.barrita li.hecho .bn{border-color:var(--negro);color:var(--negro)}
.barrita-nota{font-size:11.5px;color:var(--g600);margin:6px 0 0;line-height:1.35}
.barrita-nota b{color:var(--azul)}

/* Filas editables (deudas, metas) */
.filas{display:grid;gap:10px}
.fila-e{border:var(--suave);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.fila-e-cab{display:flex;gap:8px;align-items:center;justify-content:space-between}
.fila-e-cab input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--g400);font:inherit;font-weight:700;font-size:1rem;padding:2px 0;background:transparent}
.fila-e-cab input:focus{outline:none;border-bottom-color:var(--negro)}
.quitar{border:0;background:none;color:var(--g600);font-size:.85rem;text-decoration:underline;padding:2px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:grid;gap:3px;font-size:.8rem;color:var(--g600);font-weight:600}
.mini .monto{margin:0}
.mini .monto span{font-size:.95rem;padding-left:10px}
.mini .monto input{font-size:1rem;padding:8px 8px 8px 2px;font-weight:700}
.mini .monto em{font-style:normal;font-size:.8rem;color:var(--g600);padding-right:10px;white-space:nowrap}
.agregar{border:1.5px dashed var(--g400);background:var(--blanco);border-radius:10px;padding:10px;font-weight:600;font-size:.92rem;width:100%}
.agregar:hover{border-color:var(--negro)}

/* Barra apilada del ingreso */
.apilada{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1.5px solid var(--negro);margin:10px 0 8px}
.apilada i{display:block;height:100%}
.leyenda{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:.9rem}
.leyenda li{display:flex;align-items:center;gap:8px}
.leyenda .cu{flex:none;width:12px;height:12px;border-radius:3px;border:1px solid var(--negro)}
.leyenda .v{margin-left:auto;font-weight:700;white-space:nowrap}
.c-basico{background:var(--negro)}.c-deuda{background:#6b6b6b}.c-var{background:#cfcfcf}.c-sobra{background:var(--azul)}.c-falta{background:repeating-linear-gradient(45deg,var(--rojo-claro),var(--rojo-claro) 4px,#f5b5b5 4px,#f5b5b5 8px)}
.sobres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sobre{border:var(--linea);border-radius:10px;padding:10px;display:grid;gap:2px;align-content:start}
.sobre span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g600)}
.sobre b{font-size:1.15rem;letter-spacing:-.02em}
.sobre small{font-size:.76rem;color:var(--g600);line-height:1.3}
.sobre.futuro{border-color:var(--azul);background:var(--azul-claro)}
@media (max-width:420px){.sobres{grid-template-columns:1fr}}

/* Tarjetas de comparación de estrategias */
.opciones3{display:grid;gap:8px;margin:10px 0}
@media (min-width:560px){.opciones3{grid-template-columns:repeat(3,1fr)}}
.op3{border:1.5px solid var(--g400);border-radius:10px;padding:12px;background:var(--blanco);text-align:left;display:grid;gap:2px;align-content:start}
.op3[aria-pressed="true"]{border-color:var(--negro);box-shadow:inset 0 0 0 1px var(--negro)}
.op3 .t{font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--g600)}
.op3 b{font-size:1.25rem;letter-spacing:-.02em}
.op3 small{font-size:.8rem;color:var(--g600);line-height:1.35}
.op3.gris b{color:var(--g600)}
.g-linea2{fill:none;stroke:var(--negro);stroke-width:2;stroke-linejoin:round}
.g-linea3{fill:none;stroke:var(--g400);stroke-width:2;stroke-dasharray:5 4}
.ley-g{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--g600);margin:2px 0 8px}
.ley-g i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:5px}
.orden{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:o}
.orden li{counter-increment:o;display:flex;gap:10px;align-items:baseline;border:var(--suave);border-radius:8px;padding:8px 10px;font-size:.93rem}
.orden li::before{content:counter(o);flex:none;width:20px;height:20px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(3px)}
.orden li span{margin-left:auto;font-weight:700;white-space:nowrap}

/* Meses de protección */
.meses-p{display:grid;gap:6px;margin:10px 0}
.mes-p{display:grid;grid-template-columns:3.2rem 1fr;gap:8px;align-items:center;font-size:.82rem}
.mes-p .pista{height:18px;border-radius:4px;background:var(--g200);overflow:hidden;display:flex}
.mes-p .pista i{display:block;height:100%}
.p-ingreso{background:var(--negro)}.p-fondo{background:var(--azul)}.p-falta{background:repeating-linear-gradient(45deg,var(--rojo-claro),var(--rojo-claro) 4px,#f5b5b5 4px,#f5b5b5 8px)}
.lista-ok{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.lista-ok li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.lista-ok input{flex:none;width:18px;height:18px;margin-top:3px;accent-color:var(--azul)}

/* Metas */
.meta-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:var(--suave);padding-top:8px;font-size:.92rem}
.meta-r b{font-size:1.1rem;letter-spacing:-.02em;white-space:nowrap}
.total-metas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:var(--linea);padding-top:10px;margin-top:6px;font-weight:700}

/* Comparador */
.tabla td.num,.tabla th.num{text-align:right;white-space:nowrap}
.tabla tr.destaca td{background:var(--azul-claro)}
.sello{display:inline-block;font-size:10.5px;font-weight:700;border:1.5px solid var(--ambar);color:var(--ambar);background:var(--ambar-claro);padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.revisor{border:1.5px solid var(--ambar);background:var(--ambar-claro);border-radius:10px;padding:14px 16px;margin-top:16px}
.revisor .monto{background:var(--blanco)}
.puente{display:flex;align-items:center;gap:12px;border:var(--linea);border-radius:10px;padding:14px 16px;margin-top:16px;text-decoration:none}
.puente:hover{background:var(--suelo)}
.puente .bn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--negro);color:var(--blanco);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.puente span:nth-child(2){flex:1}
.puente small{display:block;color:var(--g600);font-size:.85rem;line-height:1.35}
.puente .flecha{font-size:1.3rem}
.dos>*,.fila-e>*,.calc>*{min-width:0}
.mini .monto input{width:100%;min-width:0}
.fila-e .chips .chip-b{padding:6px 10px}
.campo>.chips{flex:none;flex-wrap:nowrap}
.lugar-g.destaca{border:1.5px solid var(--azul);background:var(--azul-claro)}
.lugar-g .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.lugar-g .cifras div{background:var(--blanco);border:var(--suave);border-radius:8px;padding:6px 8px}
.lugar-g .cifras span{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g600);line-height:1.2}
.lugar-g .cifras b{font-size:1rem;letter-spacing:-.01em}
/* Inversión v1.1: riesgo y encaje */
.op-inv{display:grid;gap:6px}
.op-inv h3{margin:0}
.op-inv.encaja{border:1.5px solid var(--azul)}
.encaje{margin:0;font-size:.85rem;font-weight:600;color:var(--g600)}
.op-inv.encaja .encaje{color:var(--azul)}
.riesgo{display:flex;align-items:center;gap:4px;font-size:.82rem}
.riesgo span{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--g600);margin-right:4px}
.riesgo i{width:18px;height:8px;border-radius:2px;background:var(--g300)}
.riesgo i.r-on{background:var(--negro)}
.riesgo b{margin-left:6px;font-weight:600}
.op-inv dl{margin:2px 0}
.mas summary{cursor:pointer;font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.mas[open] summary{margin-bottom:6px}
.op-inv dl{grid-template-columns:1fr;gap:0}
.op-inv dt{font-size:.78rem;margin-top:6px}

.sel{font:inherit;font-weight:700;border:1px solid var(--g400);border-radius:8px;background:var(--suelo);padding:9px 10px;width:9rem;flex:none}
.barrita .bl{font-size:10px}
@media (max-width:380px){.campo{flex-wrap:wrap}.campo>.chips{flex-wrap:wrap}}

/* v1.1: hoja de la escalera y página de datos */
.hoja{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.hoja li{border:var(--suave);border-radius:10px;padding:12px 14px}
.hoja li.aqui{border:1.5px solid var(--azul);background:var(--azul-claro)}
.hoja li.hecho{border-color:var(--verde)}
.hoja-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hoja-cab .bn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.dato-f h3{margin:0}
.dato-v{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;margin:4px 0}

.solo-imprimir{display:none}
@media print{
  .solo-imprimir{display:block}
  #nav,#barrita,footer,.no-imprimir,.nota-lab{display:none!important}
  body{font-size:12px}
  main{padding:0;max-width:none}
  .hoja li{break-inside:avoid}
  a{text-decoration:none;color:inherit}
}

.dar{border-top:var(--suave);margin-top:12px;padding-top:12px}
.sobres:has(.sobre:nth-child(4)){grid-template-columns:repeat(2,1fr)}
.dar .de100,.dar .de100 *{font-size:.88rem;line-height:1.5}.dar .de100 b{font-size:.88rem}
/* Lab 3 Pro */
.pro-modo{margin-top:6px}
.pro-grid{display:grid;gap:12px;margin-top:12px}
.pro-grid .calc{margin-top:0}
.pro-grid.experto{grid-template-columns:1fr}
@media (min-width:900px){ .pro-grid.experto{grid-template-columns:1fr 1fr} }
.pro-c .monto em{font-style:normal;font-size:.78rem;color:var(--g600);padding-right:10px;white-space:nowrap}
.pro-c .chico-monto{width:11rem}
.explica ul li{margin-bottom:4px}
.campo.apila{flex-wrap:wrap}.campo.apila>.chips{flex-wrap:wrap}
.conecta{font-size:.88rem;line-height:1.5;margin:0;padding:8px 10px;border-left:3px solid var(--azul);background:var(--azul-claro);border-radius:0 8px 8px 0}
.palancas{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.palancas li{display:grid;grid-template-columns:1fr;gap:3px;border-bottom:var(--suave);padding-bottom:8px}
.palancas .pt{font-size:.9rem;font-weight:600}
.palancas .pb{height:8px;background:var(--g200);border-radius:4px;overflow:hidden}
.palancas .pb i{display:block;height:100%;background:var(--azul);border-radius:4px}
.palancas .pv{font-size:.95rem;font-weight:700}
.palancas .pv small{display:block;font-weight:400;color:var(--g600);font-size:.8rem}
.lecciones{display:grid;gap:8px}
@media (min-width:760px){.lecciones{grid-template-columns:1fr 1fr}}
.lecciones .bn{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:12px;align-items:center;justify-content:center;margin-right:4px}
.campo.apila>.chips{flex:1 1 100%;min-width:0}

/* Pro: cadena "Cómo se conecta todo" */
.cadena{border:1.5px solid var(--g300);border-radius:12px;padding:14px;margin:8px 0 4px}
.cad-et{margin:0 0 8px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--g600);font-weight:600}
.cad-fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cad-caja{border:1px solid var(--g300);border-radius:8px;padding:8px 10px;min-width:0}
.cad-caja b{display:block;font-size:.9rem;margin-bottom:2px}
.cad-caja span{display:block;font-size:.82rem;color:var(--g600);line-height:1.4}
.cad-flecha{margin:6px 0;text-align:center;color:var(--g600);font-size:1.1rem;line-height:1}
.cad-cuenta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cad-cuenta>div{flex:1 1 0;min-width:0;border:1px solid var(--g300);border-radius:8px;padding:8px 10px}
.cad-cuenta>div:last-child{border-color:var(--azul);background:var(--azul-claro)}
.cad-cuenta span{display:block;font-size:.78rem;color:var(--g600)}
.cad-cuenta b{display:block;font-size:.95rem}
.cad-cuenta i{font-style:normal;font-weight:600;color:var(--g600)}
.cad-final{border:1.5px solid var(--azul);background:var(--azul-claro);border-radius:10px;padding:10px 12px}
.cad-final span{display:block;font-size:.8rem;color:var(--g600)}
.cad-final b{display:block;font-size:1.5rem;color:var(--azul)}
.cad-final p{margin:4px 0 0}
.pro-aviso{margin-top:12px}
@media (max-width:560px){.cad-fila{grid-template-columns:1fr}.cad-cuenta{flex-direction:column;align-items:stretch}.cad-cuenta i{text-align:center}}
/* Pro: gráfica del dinero y secciones plegables */
.g-tit{margin:0 0 2px;font-weight:600;font-size:1rem}
.g-num{font-size:10px;font-weight:700;fill:var(--negro);font-family:inherit}
.g-pasos{margin:8px 0 0;padding-left:1.4rem;font-size:.9rem;line-height:1.5}
.g-pasos li{margin-bottom:3px}
.ter-eq{display:block;margin-bottom:4px;color:var(--negro)}
.pleg{border:1.5px solid var(--negro);border-radius:10px;margin:10px 0;background:var(--blanco)}
.pleg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px}
.pleg>summary::-webkit-details-marker{display:none}
.pleg>summary b{display:block;font-size:1rem}
.pleg>summary small{display:block;font-size:.84rem;color:var(--g600);margin-top:1px}
.pleg>summary i{flex:none;width:22px;height:22px;border:1.5px solid var(--negro);border-radius:50%;position:relative}
.pleg>summary i::before,.pleg>summary i::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:1.5px;margin-top:-.75px;background:var(--negro)}
.pleg>summary i::after{transform:rotate(90deg);transition:transform .15s}
.pleg[open]>summary i::after{transform:rotate(0)}
.pleg[open]>summary{border-bottom:1px solid var(--g300)}
.pleg-in{padding:4px 16px 14px}
.pleg-in>h3:first-child,.pleg-in>p:first-child{margin-top:10px}
/* Pro: camino del dinero, fuentes y equipo */
.camino{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.camino li{position:relative;padding:22px 10px 0 0;min-width:0}
.camino li::before{content:"";position:absolute;left:0;right:0;top:7px;height:1.5px;background:var(--negro)}
.camino li:last-child::before{right:auto;width:14px}
.camino li::after{content:"";position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;background:var(--blanco);border:1.5px solid var(--negro)}
.camino li.peor::after{background:var(--rojo);border-color:var(--rojo)}
.camino li.fin::after{background:var(--azul);border-color:var(--azul)}
.camino li.fin.mal::after{background:var(--rojo);border-color:var(--rojo)}
.cm-mes{display:block;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--g600);font-weight:600}
.camino b{display:block;font-size:.98rem;margin:2px 0}
.cm-txt{display:block;font-size:.85rem;line-height:1.45;color:var(--g600)}
.camino li.peor b{color:var(--rojo)}.camino li.fin b{color:var(--azul)}
.fuentes{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--negro)}
.fuentes i{display:block;height:100%}
.equipo{margin-top:18px;padding:16px 18px;border:1.5px solid var(--negro);border-radius:12px;border-left:6px solid var(--azul)}
.ter-res{display:block;margin:4px 0 6px;padding:8px 10px;background:var(--azul-claro);border-radius:8px;color:var(--negro)}
.conecta::before{content:"Para entenderlo, con un ejemplo general";display:block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--azul);font-weight:600;margin-bottom:3px}
@media (max-width:620px){
  .camino{grid-template-columns:1fr}
  .camino li{padding:0 0 16px 28px}
  .camino li::before{left:6.5px;right:auto;top:16px;bottom:0;width:1.5px;height:auto}
  .camino li:last-child::before{display:none}
  .camino li::after{top:2px}
}

</style>

<main id="app" aria-live="polite"><noscript><p>Esta herramienta necesita JavaScript activado en el navegador.</p></noscript></main>

<script>window.UMBRAL_URLS = {"portada": "https://lab3.umbralgt.com/", "escalera": "https://lab3.umbralgt.com/escalera/", "mes": "https://lab3.umbralgt.com/mi-mes/", "fondo": "https://lab3.umbralgt.com/fondo/", "deudas": "https://lab3.umbralgt.com/deudas/", "proteccion": "https://lab3.umbralgt.com/proteccion/", "metas": "https://lab3.umbralgt.com/metas/", "inversion": "https://lab3.umbralgt.com/inversion/", "vivienda": "https://lab3.umbralgt.com/vivienda/", "resumen": "https://lab3.umbralgt.com/mi-escalera/", "datos": "https://lab3.umbralgt.com/datos/", "pro": "https://lab3.umbralgt.com/pro/", "lab1": "https://lab1.umbralgt.com", "lab2": "https://lab2.umbralgt.com"};</script>
<script src="/fin-motor.js"></script>
<script src="/comun.js"></script>
<script>
// Peldaño 4 · Protección: cuánto aguanta tu hogar si te enfermás o te quedás sin trabajo.
(function(){
'use strict';
const M = window.FinMotor, U = window.U, $app = document.getElementById('app');
if(!M || !U || !M.coberturaEnfermedad){ $app.innerHTML = '<p class="aviso"><strong>No se pudo cargar la herramienta.</strong> Revisá tu conexión y volvé a abrir la página.</p>'; return; }
const Q = U.Q, D = M.DATOS;
U.barrita(4); U.activarGlosario($app);

const d = U.datos();
function cuotasDe(d){
  if(d.co==null && d.ts==null) return null;
  const x = M.contexto({q_tiene_tc: d.ts>0, q_saldo_tc: d.ts||0, q_tasa_tc: d.tt ? {v:d.tt, unidad:'anual'} : null, q_pago_tc: d.tp, q_cuotas_otras: d.co||0});
  return Math.round(x.C||0);
}
let origen = d.g!=null ? 'lab' : 'ejemplo';
const s = origen==='lab'
  ? {g:d.g, cuotas:cuotasDe(d) ?? 0, a:d.a ?? 0, igss: d.ig===1 ? 'si' : d.ig===0 ? 'no' : 'si', sa:d.sa ?? null, seguro: d.se || 'no', unico: d.u===1 ? 'si' : 'no'}
  : {g:6000, cuotas:800, a:9000, igss:'si', sa:7500, seguro:'no', unico:'no'};
let caso = 'enfermedad';

function pantalla(){
  $app.innerHTML = `
    <p class="ceja">Laboratorio 3 · Peldaño 4 de la escalera</p>
    <h1>Protección</h1>
    <p>Un tropiezo de salud o de trabajo es lo que más rápido tumba un plan. Mirá, mes a mes, cuánto aguantaría tu hogar y qué te cubre hoy.</p>
    ${U.banner(origen)}
    <section class="calc" aria-label="Tus números">
      ${U.campo('p-g','Tus gastos básicos al mes','Vivienda, comida, transporte, servicios', s.g)}
      ${U.campo('p-c','Pagos de deudas al mes','Siguen llegando aunque no trabajés', s.cuotas)}
      ${U.campo('p-a','Tu fondo de emergencia hoy','Lo que podrías usar sin pedir prestado', s.a)}
      <div class="extras">
        <div class="campo"><span>¿Te descuentan IGSS?</span>${U.chips('igss', [['si','Sí'],['no','No']], s.igss, 'IGSS')}</div>
        <div id="p-sal" class="${s.igss==='si'?'':'oculto'}">${U.campo('p-sa','Tu salario antes de descuentos','El que tu patrono reporta al IGSS', s.sa)}</div>
        <div class="campo"><span>¿Tenés seguro médico privado?</span>${U.chips('seg', [['si','Sí'],['no','No']], s.seguro, 'Seguro médico')}</div>
        <div class="campo"><span>¿Tu ingreso es el único del hogar?</span>${U.chips('uni', [['si','Sí'],['no','No']], s.unico, 'Único ingreso')}</div>
      </div>
    </section>
    <div id="resultado" aria-live="polite"></div>
    ${U.notaLab('Los montos del IGSS son aproximados; el IGSS calcula el subsidio con tus salarios reportados.')}
    ${U.pie()}`;
  ['p-g','p-c','p-a','p-sa'].forEach(id => document.getElementById(id).addEventListener('input', () => {
    s.g = U.leerNum('p-g'); s.cuotas = U.leerNum('p-c') ?? 0; s.a = U.leerNum('p-a') ?? 0; s.sa = U.leerNum('p-sa'); tocado(); dibujar(); }));
  U.enlazarChips($app, 'igss', v => { s.igss = v; document.getElementById('p-sal').classList.toggle('oculto', v!=='si'); tocado(); dibujar(); });
  U.enlazarChips($app, 'seg', v => { s.seguro = v; tocado(); dibujar(); });
  U.enlazarChips($app, 'uni', v => { s.unico = v; tocado(); dibujar(); });
  dibujar();
}
function tocado(){ if(origen==='ejemplo'){ origen='propio'; const o = $app.querySelector('.origen'); if(o) o.remove(); } }

function mesesHTML(c){
  const nec = c.filas[0].necesidad || 1;
  return `<div class="meses-p" role="img" aria-label="Mes a mes: lo que entra, lo que sale del fondo y lo que falta">${c.filas.map(f => {
    return `<div class="mes-p"><span>Mes ${f.mes}</span><span class="pista">${f._ing>0?`<i class="p-ingreso" style="width:${100*f._ing/nec}%"></i>`:''}${f._fondo>0?`<i class="p-fondo" style="width:${100*f._fondo/nec}%"></i>`:''}${f._falta>0?`<i class="p-falta" style="width:${100*f._falta/nec}%"></i>`:''}</span></div>`; }).join('')}</div>
    <ul class="leyenda chico"><li><span class="cu p-ingreso"></span>${caso==='enfermedad' && s.igss==='si' ? 'Lo que paga el IGSS' : 'Ingreso'}</li><li><span class="cu p-fondo"></span>Lo que sale de tu fondo</li><li><span class="cu p-falta"></span>Lo que faltaría</li></ul>`;
}

function dibujar(){
  const box = document.getElementById('resultado');
  if(!(s.g>0)){ box.innerHTML = '<p class="suave" style="margin-top:16px">Escribí tus gastos básicos para ver el resultado.</p>'; return; }
  if(origen!=='ejemplo') U.actualizar({g:s.g, a:s.a, ig: s.igss==='si' ? 1 : 0, sa: s.igss==='si' ? s.sa : null, se:s.seguro, u: s.unico==='si' ? 1 : 0});
  const conIGSS = caso==='enfermedad' && s.igss==='si' && s.sa>0;
  const c = M.coberturaEnfermedad({salario:s.sa, igss:conIGSS, gastos:s.g, cuotas:s.cuotas, ahorro:s.a, meses:6});
  // reparto de cada mes entre ingreso, fondo y faltante
  let queda = s.a; c.filas.forEach(f => { f._ing = Math.min(f.ingreso, f.necesidad); const usa = Math.min(queda, f.falta); f._fondo = usa; f._falta = f.falta - usa; queda -= usa; });
  const metaM = s.unico==='si' ? 6 : 3, meta = metaM*s.g, falta = Math.max(0, meta - s.a);
  const ag = c.aguantaMeses, aguantaTxt = c.cubreTodo ? 'más de 6 meses' : ag < 0.25 ? 'menos de una semana' : ag < 1 ? (Math.round(ag*4.3)<=1 ? 'una semana' : `unas ${Math.round(ag*4.3)} semanas`) : `${ag.toFixed(1).replace('.0','')} meses`;
  const sub = c.subsidio, protegido = falta===0 && s.seguro==='si';
  const nivel = protegido ? 'ideal' : (s.a >= meta ? 'bien' : s.a >= s.g ? 'minimo' : 'riesgo');
  const paso = falta>0 ? `Llevar tu fondo de emergencia a ${metaM} meses de gastos (${Q(meta)}). Te faltan ${Q(falta)}.`
    : s.seguro!=='si' ? 'Tu fondo ya cubre lo recomendado. El siguiente paso es averiguar opciones de seguro médico y comparar con las preguntas de abajo.'
    : 'Estás protegido en lo básico. Revisá una vez al año que tu fondo y tu seguro sigan alcanzando, y pasá a tus metas.';
  box.innerHTML = `
    <section class="breve">
      <p class="etq" style="margin-top:0">Tu protección <span class="nv nv-${nivel}">${M.NIVEL_NOMBRE[nivel]}</span></p>
      ${U.chips('caso', [['enfermedad','Si te enfermás'],['desempleo','Si te quedás sin trabajo']], caso, 'Qué tropiezo')}
      <p class="lugar" style="margin-top:10px">${caso==='enfermedad' ? 'Si te enfermás y no podés trabajar' : 'Si te quedás sin trabajo'}, tu fondo alcanza para <b>${aguantaTxt}</b>.</p>
      <p class="chico">Cada mes necesitás ${Q(c.filas[0].necesidad)}: ${Q(s.g)} de gastos y ${Q(s.cuotas||0)} de deudas.${conIGSS ? ` El IGSS pagaría unos ${Q(sub.mensual)} al mes.` : caso==='enfermedad' && s.igss==='si' && !(s.sa>0) ? ' Escribí tu salario para calcular el subsidio del IGSS.' : ''}</p>
      ${mesesHTML(c)}
      <div class="siguiente"><p class="etq" style="margin-top:0">Tu siguiente paso</p><p class="sig-texto">${U.glosar(paso)}</p></div>
    </section>
    ${falta>0 ? U.puente('fondo', `Armar mi fondo de ${metaM} meses`, `Te faltan ${Q(falta)}. Mirá en qué fecha llegás según lo que apartes.`) : U.puente('metas','Siguiente: Mis metas','Con lo básico protegido, cuánto apartar para el retiro y otras metas.')}
    ${U.cumplir('Una emergencia es peor si además hay que buscar papeles o explicar todo. Esto se hace una vez y dura años.', [
      {t:'Todo en un solo lugar', html:`<p class="chico">Una lista para tener a mano, en papel o en el teléfono:</p>
        <ul class="lista-ok">${['Número de afiliación y carné del IGSS','Póliza y teléfono del seguro, si tenés','Dónde está tu fondo de emergencia y cómo sacarlo','Contactos de tu trabajo y de tu banco','Una lista de tus deudas y cuánto pagás de cada una'].map((t,k) => `<li><input type="checkbox" id="ok${k}"><label for="ok${k}">${t}</label></li>`).join('')}</ul>
        <p class="suave chico" style="margin-top:6px">Las marcas no se guardan: es solo para revisar.</p>`},
      {t:'Alguien que sepa dónde está todo', html:`<p class="chico">Si vos no podés hacer los trámites, otra persona de confianza tiene que poder hacerlos. Contale dónde está la lista.</p>
        <button type="button" class="btn sec" id="compartir">Avisarle a alguien de confianza</button>${U.tambienVos()}`},
      {t:'Una revisión al año', html:`<p class="chico">Un recordatorio una vez al año para revisar si tu fondo sigue cubriendo ${metaM} meses (los gastos suben) y si tu seguro sigue vigente.</p>
        <button type="button" class="btn sec" id="ics-anual">Agregar a mi calendario</button><p class="suave chico" id="ics-anual-estado" style="margin:6px 0 0">Se descarga un archivo de calendario. No se envía nada a ningún lado.</p>`}])}
    <h2>Para saber más</h2>
    ${U.bloque('p1','1','Qué te cubre el IGSS','Subsidio, atención médica y sus límites.', igssHTML(sub))}
    ${U.bloque('p2','2','Preguntas antes de contratar un seguro médico','Para comparar sin que te vendan.', seguroHTML())}
    ${U.bloque('p3','3','Por qué 3 o 6 meses','Lo que suele durar un tropiezo.', porqueHTML(metaM))}`;
  U.enlazarChips(box, 'caso', v => { caso = v; dibujar(); });
  document.getElementById('ics-anual').onclick = () => U.descargarICS({anual:true, uid:'proteccion', titulo:'Revisar mi fondo de emergencia y mi seguro',
    descripcion:`¿Mi fondo sigue cubriendo ${metaM} meses de gastos? ¿Mi seguro sigue vigente? ¿Mi lista de papeles está al día?`}, 'revision-anual-proteccion.ics', document.getElementById('ics-anual-estado'));
  document.getElementById('compartir').onclick = () => U.compartir('Armé una lista con mis papeles importantes (IGSS, seguro, cuentas y deudas) por si alguna vez necesito que me ayudés con un trámite. Te cuento dónde está.');
}

function igssHTML(sub){
  const max = D.igss_subsidio_max.v.semanasEnf;
  if(s.igss!=='si') return `<p>Sin IGSS no hay subsidio si te enfermás ni pensión al retirarte. Tu fondo de emergencia es tu principal protección, por eso conviene que sea de ${s.unico==='si'?6:3} meses o más.</p>
    ${U.dato(`${D.informalidad.v} de cada 100 personas que trabajan en Guatemala lo hacen en el sector informal, por lo general sin IGSS.`, D.informalidad)}
    <p class="chico">Si trabajás por tu cuenta, podés preguntar directamente en el IGSS qué opciones de afiliación existen para tu caso.</p>`;
  return `<ul class="chico">
      <li><b>Subsidio por enfermedad:</b> ${U.glosar(`dos tercios de tu salario diario desde el cuarto día, con un tope de ${Q(D.igss_subsidio_tope.v)} al día. El primer día lo paga el patrono; el segundo y el tercero no se pagan.`)}${sub ? ` Con tu salario serían unos <b>${Q(sub.diario)} al día</b>${sub.topado ? ' (llegás al tope)' : ''}.` : ''}</li>
      <li><b>Hasta cuándo:</b> hasta ${max} semanas por una misma enfermedad.</li>
      <li><b>Atención médica:</b> consultas, hospital y medicinas en la red del IGSS.</li>
      <li><b>Si te quedás sin trabajo:</b> el IGSS no paga un subsidio por desempleo. Por eso el fondo es tan importante.</li></ul>
    <p class="suave chico">${U.fuente(D.igss_subsidio_frac)}; tope: ${U.fuente(D.igss_subsidio_tope)}</p>`;
}
function seguroHTML(){
  return `<p>No recomendamos aseguradoras ni productos. Estas preguntas sirven para comparar cualquier seguro médico:</p>
    <ul class="chico">
      <li>${U.glosar('¿Cuánto es el deducible y cuánto el coaseguro? Ahí se ve cuánto pagás vos en cada emergencia.')}</li>
      <li>¿Cuál es el máximo que paga el seguro por año y por enfermedad?</li>
      <li>${U.glosar('¿Cubre preexistencias? ¿Desde cuándo?')}</li>
      <li>¿Hay períodos de espera para algunas enfermedades o para maternidad?</li>
      <li>¿Qué hospitales y médicos están en la red?</li>
      <li>¿Qué pasa con el seguro si cambiás de trabajo?</li>
      <li>¿Cuánto sube la prima con la edad?</li></ul>
    ${U.dato(`En Guatemala, ${D.gasto_bolsillo_salud.v} de cada 100 quetzales que se gastan en salud salen del bolsillo de las familias. Solo ${D.enifh.v.seguro} de cada 100 adultos tienen algún seguro.`, D.gasto_bolsillo_salud, D.enifh)}`;
}
function porqueHTML(m){
  return `<p>Encontrar otro trabajo o recuperarse de una enfermedad suele tomar meses, no semanas. Por eso la meta de protección es de 3 meses de gastos, y de 6 si tu ingreso es el único del hogar: si nadie más aporta, un tropiezo pesa más.</p>
    <p class="chico">Son referencias de UMBRAL, no reglas oficiales. Si tu trabajo es muy estable, 3 meses pueden bastar; si tus ingresos varían mucho, conviene acercarse a 6.</p>
    ${U.dato(`Ante una emergencia, solo ${D.findex_emergencia.v.ahorros} de cada 100 guatemaltecos usarían sus propios ahorros; ${D.findex_emergencia.v.familia} recurrirían a familia o amigos.`, D.findex_emergencia)}`;
}

pantalla();
U.quitarHash();
})();

</script>
